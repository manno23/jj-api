[package]
name = "jj-fossil-cas"
description = "Fossil-style content-addressed blob store over a portable SQLite surface"
publish = false

version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[dependencies]
flate2 = { workspace = true }
rusqlite = { workspace = true, optional = true }
sha3 = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["rusqlite"]
# Native SQLite connection (`RusqliteConn`). Disable for wasm32 builds, where
# the host supplies its own `SqlConn` (e.g. a Durable Object's `sql.exec`).
rusqlite = ["dep:rusqlite"]

[lints]
workspace = true
